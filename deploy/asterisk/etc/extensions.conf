[from-unpod]
; Inbound calls from the Unpod trunk land here. Not used by the outbound
; survey campaign, but wired so inbound works later without redoing config.
exten => _X.,1,NoOp(Inbound from Unpod to ${EXTEN})
 same => n,Stasis(dograh)
 same => n,Hangup()

[test-out]
exten => _[+0-9].,1,Set(CALLERID(num)=+918071539240)
 same => n,Set(CALLERID(name)=Survey)
 same => n,Dial(PJSIP/${EXTEN}@unpod,40)
 same => n,Hangup()
